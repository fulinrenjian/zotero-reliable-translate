name: 问题反馈 / Bug report
description: 反馈 Reliable Translate 增强版问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "本入口属于 fulinrenjian 的增强版。请勿附密钥、完整 Zotero 配置、私人文献或未脱敏日志。"
  - type: input
    id: versions
    attributes:
      label: 系统、Zotero 和插件版本
      placeholder: "Windows / Zotero 10.0.6 / Reliable Translate 0.1.3"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误信息或脱敏截图（可选）
      description: 只提供与问题有关的内容；隐藏论文隐私和凭证。
